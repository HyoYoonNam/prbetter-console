plugins {
    id 'java'
    id 'com.adarshr.test-logger' version '4.0.0'
}

// 모든 의존성을 포함한 fat jar을 만들기 위한 설정
jar {
    manifest {
        attributes 'Main-Class': 'prbetter.Application'
    }
    enabled=true
    archiveClassifier = ''
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

group = 'console.prbetter'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // junit: mission-utils에 포함
//    testImplementation platform('org.junit:junit-bom:5.10.0')
//    testImplementation 'org.junit.jupiter:junit-jupiter'

    // assertj: mission-utils에 포함
//    testImplementation 'org.assertj:assertj-core:3.6.1'

    // jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.0'
    implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names:2.18.0'

    // lombok
    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")
    testCompileOnly("org.projectlombok:lombok:1.18.42")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.42")

    // mockito
    testImplementation "org.mockito:mockito-core:5.+"

    // mission-utils
    implementation('com.github.woowacourse-projects:mission-utils:1.2.0') {
        exclude group: 'org.mockito'
    }
}

test {
    useJUnitPlatform()
    testlogger {
        theme 'mocha'
    }
}
